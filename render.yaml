services:
  - type: web
    name: thesis-prototype-backend
    runtime: python
    rootDir: FIAdaBoost
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false

  - type: static
    name: thesis-prototype-frontend
    rootDir: Solar_Energy_Potential_Forecasting_Prototype
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
